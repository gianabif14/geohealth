services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geohealth_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geohealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geohealth_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-geohealth}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - geohealth_pg:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geohealth} -d ${POSTGRES_DB:-geohealth}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geohealth_pg:
